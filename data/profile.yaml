# Everything recruiters see on the home page and /resume comes from this file.
headline: "Systems Administrator · Data & Reporting"
location: "Hudson Valley, NY"
# First day in IT (Resorts World Catskills). "{years}" anywhere below becomes
# whole years since this date, e.g. "5+", recalculated on every build and page load.
career_start: "2020-12-20"
availability: "Freelance IT projects welcome"
summary: >-
  {years} years keeping business-critical systems running in a highly regulated
  casino environment. I stood up the full IT stack for a brand-new resort
  (60+ VMs, networking, hybrid identity, backups), and now I turn data into
  answers with SQL, Excel and Power Query as a marketing analyst. I bring
  infrastructure and data work together, with Azure next.

