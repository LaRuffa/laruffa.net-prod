experience:
  - role: "Marketing Analyst I"
    company: "Resorts World Catskills (Genting Americas)"
    location: "Monticello, NY"
    dates: "May 2026 – Present"
    bullets:
      - "Run recurring SQL, Excel and Power Query reporting that produces monthly promotional statistics and tracking summaries."
      - "Validate multi-property promotional datasets against backend database logs for financial accuracy."
      - "Rebuilt the manual prize redemption process to pull data directly from the database instead of scraping the application interface."
  - role: "Systems Administrator"
    company: "Resorts World Hudson Valley / Resorts World Catskills"
    location: "Newburgh / Monticello, NY"
    dates: "Sep 2022 – May 2026"
    bullets:
      - "Sole systems administrator at Hudson Valley's opening. Built the entire IT infrastructure: 60+ VMs, server configuration, software and user access."
      - "Deployed hybrid identity from scratch, moving on-prem Active Directory into Entra ID with Okta and Duo MFA."
      - "Restored servers and front-line PCs within hours of the global CrowdStrike blue-screen outage, avoiding business downtime."
      - "Maintained an isolated SQL Server data warehouse for business continuity, with daily restore checks of system and user databases."
      - "Directed two IT technicians through hardware lifecycle projects, firmware rollouts and network switch staging for the Hudson Valley launch."
      - "Led gaming system, firewall and switch firmware upgrades and ISP failover testing; contained a ransomware incident."
      - "Wrote runbooks and hardware lifecycle guides that standardized deployments and sped up onboarding."
  - role: "IT Technician"
    company: "Resorts World Catskills"
    location: "Monticello, NY"
    dates: "Dec 2020 – Sep 2022"
    bullets:
      - "Front-line hardware, software and application support across 1,000+ user endpoints, tracked in Zendesk, KACE and ServiceDesk Plus."
      - "Fixed connectivity problems with static IP assignments and DNS troubleshooting in a Microsoft server environment."
      - "Wrote operational guides that cut training time for tier-1 support staff."
      - "Set up POS systems for banquet events and supported table games installs, including terminating and labeling CAT6."
  - role: "IT Consultant (freelance)"
    company: "Wurtsboro Diner & Cafe"
    location: "Wurtsboro, NY"
    dates: "Jul 2025"
    bullets:
      - "Replaced outdated Arris hardware with a modern Ubiquiti mesh network and upgraded PCs and cabling."
      - "Kept on as the main consultant for future upgrades."

