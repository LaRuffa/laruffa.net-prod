<ol class="timeline">
    {{ range site.Data.profile.experience }}
    <li class="timeline-item">
        <div class="timeline-head">
            <h3>{{ .role }} <span class="at">@ {{ .company }}</span></h3>
            <span class="mono dim">{{ .dates }} · {{ .location }}</span>
        </div>
        <ul>
            {{ range .bullets }}<li>{{ . }}</li>{{ end }}
        </ul>
    </li>
    {{ end }}
</ol>
