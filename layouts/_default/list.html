{{ define "main" }}
<section class="container page">
    <header class="page-header">
        <p class="mono dim">~/{{ .Section }}</p>
        <h1>{{ .Title }}</h1>
        {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
    </header>
    <div class="post-list">
        {{ range .Pages }}
        <a class="card post-card" href="{{ .RelPermalink }}">
            <span class="mono dim">{{ .Date.Format "2006-01-02" }}</span>
            <h3>{{ .Title }}</h3>
            <p>{{ .Summary | plainify | truncate 180 }}</p>
        </a>
        {{ else }}
        <p class="mono dim">$ ls ./posts<br>no posts yet. Write-ups are coming.</p>
        {{ end }}
    </div>
</section>
{{ end }}
