{{ define "main" }}
<article class="container page">
    <header class="page-header">
        <p class="mono dim">~/{{ .File.ContentBaseName }}</p>
        <h1>{{ .Title }}</h1>
        {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
        {{ if and (eq .Section "blog") (.Params.showMetadata | default true) }}
        <p class="mono dim">{{ .Date | time.Format ":date_long" }} · {{ .ReadingTime }} min read</p>
        {{ end }}
    </header>
    <div class="prose">
        {{ .Content }}
    </div>
</article>
{{ end }}
