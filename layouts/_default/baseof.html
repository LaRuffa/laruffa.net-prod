<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <title>{{ block "title" . }}{{ .Title }} | {{ .Site.Params.author.name }}{{ end }}</title>
    {{ partial "head.html" . }}
</head>
<body>
    <div class="bg-grid" aria-hidden="true"></div>
    {{ partial "header.html" . }}
    <main class="main">
        {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
</body>
</html>
